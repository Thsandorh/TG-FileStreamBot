name: Build Linux amd64 fsb

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build fsb
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-w -s" -o dist/fsb ./cmd/fsb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsb-linux-amd64
          path: dist/fsb
          if-no-files-found: error

      - name: Publish prerelease asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "build-${env:GITHUB_SHA}".Substring(0, 13)
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/fsb --title $tag --notes "Automated Linux amd64 build for $env:GITHUB_SHA" --prerelease
          } else {
            gh release upload $tag dist/fsb --clobber
          }
        shell: pwsh
